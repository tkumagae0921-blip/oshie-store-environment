name: oshie_store_environment
description: Read-only iOS receipt environment hint for Oshie backend selection; never credit authority.
version: 0.2.0
publish_to: none
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: OshieStoreEnvironmentPlugin
dev_dependencies:
  flutter_test:
    sdk: flutter
